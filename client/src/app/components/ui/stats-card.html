<div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-750 p-6 flex items-start justify-between hover:shadow-md transition-all duration-300">
  <div class="flex flex-col gap-1">
    <span class="text-sm font-medium text-gray-500 dark:text-slate-400">{{ title() }}</span>
    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mt-1">{{ value() }}</h3>
    @if (subValue()) {
      <span class="text-sm font-medium text-blue-600 dark:text-blue-400 mt-1">
        {{ subValue() }}
      </span>
    }
  </div>
  <div class="text-gray-400 dark:text-slate-500 transition-colors">
    <ng-content></ng-content>
  </div>
</div>
