<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Team Performance Analysis</h1>

  <div class="border-b border-gray-200 dark:border-slate-750">
    <nav class="-mb-px flex space-x-8" aria-label="Tabs">
      <button
        (click)="setActiveTab('league')"
        [class]="'whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors ' + 
          (activeTab() === 'league'
            ? 'border-blue-500 text-blue-600 dark:border-blue-400 dark:text-blue-400'
            : 'border-transparent text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:hover:text-slate-200 hover:border-gray-300 dark:hover:border-slate-600')"
      >
        League Overview
      </button>
      <button
        (click)="setActiveTab('team')"
        [class]="'whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors ' + 
          (activeTab() === 'team'
            ? 'border-blue-500 text-blue-600 dark:border-blue-400 dark:text-blue-400'
            : 'border-transparent text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:hover:text-slate-200 hover:border-gray-300 dark:hover:border-slate-600')"
      >
        Team Analysis
      </button>
    </nav>
  </div>

  <div class="mt-6">
    @if (activeTab() === 'league') {
      <app-league-analytics></app-league-analytics>
    } @else {
      <app-team-analytics></app-team-analytics>
    }
  </div>
</div>
