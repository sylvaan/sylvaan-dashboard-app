<div class="overflow-x-auto">
  <table class="min-w-full text-sm text-left">
    <thead class="bg-gray-50 dark:bg-slate-750 text-gray-500 dark:text-slate-400 font-medium border-b border-gray-200 dark:border-slate-700 uppercase tracking-wider text-xs">
      <tr>
        <th class="px-6 py-4">Pos</th>
        <th class="px-6 py-4 w-1/3">Club</th>
        <th class="px-6 py-4">MP</th>
        <th class="px-6 py-4">W</th>
        <th class="px-6 py-4">D</th>
        <th class="px-6 py-4">L</th>
        <th class="px-6 py-4">GD</th>
        <th class="px-6 py-4 font-bold text-gray-700 dark:text-slate-200">Pts</th>
        <th class="px-6 py-4 text-center">Form</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100 dark:divide-slate-750 bg-white dark:bg-slate-800">
      @for (team of teams(); track team.club) {
        <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/40 transition-colors duration-150">
          <td class="px-6 py-4 font-medium text-gray-900 dark:text-white">{{ team.pos }}</td>
          <td class="px-6 py-4 font-bold text-gray-900 dark:text-white flex items-center gap-3">
            <div [class]="'h-6 w-6 rounded-full flex items-center justify-center text-[10px] text-white font-bold ' + 
              (team.club === 'Liverpool' ? 'bg-red-700' : 
               team.club === 'Arsenal' ? 'bg-red-500' :
               team.club === 'Man City' ? 'bg-sky-400' :
               team.club === 'Chelsea' ? 'bg-blue-600' : 'bg-red-600')">
              {{ team.club.charAt(0) }}
            </div>
            {{ team.club }}
          </td>
          <td class="px-6 py-4 text-gray-600 dark:text-slate-300">{{ team.played }}</td>
          <td class="px-6 py-4 text-gray-600 dark:text-slate-300">{{ team.won }}</td>
          <td class="px-6 py-4 text-gray-600 dark:text-slate-300">{{ team.drawn }}</td>
          <td class="px-6 py-4 text-gray-600 dark:text-slate-300">{{ team.lost }}</td>
          <td class="px-6 py-4 text-gray-600 dark:text-slate-300">{{ team.gd }}</td>
          <td class="px-6 py-4 font-bold text-gray-900 dark:text-white">{{ team.points }}</td>
          <td class="px-6 py-4">
            <div class="flex items-center justify-center gap-1">
              @for (result of team.form; track $index) {
                <span
                  [class]="'h-2 w-2 rounded-full ' + getFormColor(result)"
                  [title]="result === 'W' ? 'Won' : result === 'D' ? 'Drawn' : 'Lost'"
                ></span>
              }
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
