<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Preferences</h1>

  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-slate-750 p-6 max-w-lg transition-all duration-300">
    <form class="space-y-4" (submit)="onSubmit($event)">
      <div>
        <label htmlFor="favorite-team" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1">
          Favorite Team
        </label>
        <select
          id="favorite-team"
          name="favorite-team"
          [value]="favoriteTeam()"
          (change)="onTeamChange($event)"
          class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 dark:border-slate-700 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border dark:bg-slate-900 dark:text-white"
        >
          <option>Arsenal</option>
          <option>Liverpool</option>
          <option>Man City</option>
          <option>Man Utd</option>
        </select>
      </div>

      <div class="pt-2">
        <button
          type="submit"
          class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
